# nangman-note 온프렘 Docker Compose
# network_mode: host — Linux에서 127.0.0.1:9912 credential endpoint 접근 필수
#
# 사용법:
#   ./start.sh          # 시크릿 로딩 + docker compose up
#   docker compose logs -f
#
# 모든 민감 정보는 .env + 호스트 환경변수(start.sh)로 관리합니다.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nangman-note-backend
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      # ─── 서버 ───
      NODE_ENV: production
      PORT: "9999"

      # ─── DB (AWS RDS via S2S VPN) ───
      DB_ENGINE: postgres
      DB_HOST: ${DB_HOST}
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      DB_MIGRATIONS_RUN: "true"
      DB_POOL_MAX: "10"

      # ─── AWS (IAM Roles Anywhere via credential endpoint) ───
      AWS_REGION: ap-northeast-2
      AWS_EC2_METADATA_SERVICE_ENDPOINT: http://127.0.0.1:9912
      AWS_TRANSCRIBE_JOB_PREFIX: nangman-note-dev
      AWS_TRANSCRIBE_LANGUAGE_CODE: ko-KR
      AWS_TRANSCRIBE_OUTPUT_BUCKET: ${AWS_S3_AUDIO_BUCKET}
      AWS_TRANSCRIBE_MEDIA_FORMAT: webm
      AWS_TRANSCRIBE_MAX_SPEAKER_LABELS: "8"
      AWS_S3_AUDIO_BUCKET: ${AWS_S3_AUDIO_BUCKET}
      AWS_S3_AUDIO_KEY_PREFIX: meeting-audio
      AWS_BEDROCK_MODEL_ID: ${AWS_BEDROCK_MODEL_ID}
      AWS_BEDROCK_MAX_TOKENS: "16384"
      AWS_BEDROCK_TEMPERATURE: "0.2"

      # ─── Auth (OIDC) ───
      AUTH_ENABLED: "true"
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER}
      AUTH_OIDC_AUDIENCE: ${AUTH_OIDC_AUDIENCE}
      AUTH_OIDC_JWKS_URI: ${AUTH_OIDC_JWKS_URI}

      # ─── Misc ───
      LOG_LEVEL: info
      CORS_ORIGIN: ${CORS_ORIGIN}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nangman-note-frontend
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: "0.0.0.0"

      # ─── 백엔드 프록시 (proxy.ts 런타임) ───
      BACKEND_URL: http://localhost:9999

      # ─── WebSocket (same-origin, NPM이 프록시) ───
      WS_URL: ${CORS_ORIGIN}

      # ─── App ───
      NEXT_PUBLIC_APP_NAME: TransNote
      NEXT_PUBLIC_APP_VERSION: "1.0.0"
      NEXT_PUBLIC_ENABLE_OFFLINE: "false"
      NEXT_PUBLIC_AUTO_SAVE_DELAY: "3000"

      # ─── Auth.js + Authentik ───
      NEXTAUTH_URL: ${CORS_ORIGIN}
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER_FE}
      AUTHENTIK_CLIENT_ID: ${AUTH_OIDC_AUDIENCE}
