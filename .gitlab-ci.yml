stages:
  - verify

frontend_quality:
  stage: verify
  image: node:22
  variables:
    NEXT_TELEMETRY_DISABLED: "1"
  before_script:
    - corepack enable
    - cd frontend
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
    - pnpm test
    - pnpm build
    - pnpm architecture:check
